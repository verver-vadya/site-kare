<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Страница открывается по любому несуществующему адресу, поэтому пути считаются от корня сайта.
       На превью GitHub Pages сайт живёт в /<репозиторий>/: workflow pages.yml подставляет этот путь сюда. -->
  <base href="/">
  <title>Страница не найдена — салон «Каре»</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="./" aria-label="Каре, на главную">Каре</a>
    </div>
  </header>
  <main id="main" class="section notfound">
    <div class="container">
      <p class="rubric__label">Ошибка 404</p>
      <h1>Такой страницы нет</h1>
      <p class="notfound__text">Возможно, адрес набран с&nbsp;ошибкой или страницу перенесли. Прайс, мастера и&nbsp;запись — на&nbsp;главной.</p>
      <a class="button" href="./">На главную</a>
    </div>
  </main>
</body>
</html>
